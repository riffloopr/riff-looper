<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2433"/><stop offset="1" stop-color="#0c0f16"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2c1a"/><stop offset=".5" stop-color="#5e3820"/><stop offset="1" stop-color="#3b2214"/>
    </linearGradient>
    <radialGradient id="spot" cx=".62" cy=".45" r=".6">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity=".22"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="str" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa0a8"/><stop offset=".6" stop-color="#e8ecef"/><stop offset="1" stop-color="#9aa0a8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g transform="rotate(-8 640 360)">
    <rect x="-100" y="230" width="1500" height="270" fill="url(#wood)"/>
    <!-- Bünde -->
    <g stroke="#d9d4c7" stroke-width="7">
      <line x1="80" y1="230" x2="80" y2="500"/><line x1="290" y1="230" x2="290" y2="500"/>
      <line x1="490" y1="230" x2="490" y2="500"/><line x1="680" y1="230" x2="680" y2="500"/>
      <line x1="860" y1="230" x2="860" y2="500"/><line x1="1030" y1="230" x2="1030" y2="500"/>
      <line x1="1190" y1="230" x2="1190" y2="500"/>
    </g>
    <g fill="#e9e3d2"><circle cx="390" cy="365" r="13"/><circle cx="770" cy="365" r="13"/><circle cx="1110" cy="330" r="12"/><circle cx="1110" cy="400" r="12"/></g>
    <!-- Saiten -->
    <g stroke="url(#str)">
      <line x1="-100" y1="252" x2="1400" y2="252" stroke-width="2"/>
      <line x1="-100" y1="296" x2="1400" y2="296" stroke-width="2.5"/>
      <line x1="-100" y1="340" x2="1400" y2="340" stroke-width="3"/>
      <line x1="-100" y1="386" x2="1400" y2="386" stroke-width="4"/>
      <line x1="-100" y1="432" x2="1400" y2="432" stroke-width="5"/>
      <line x1="-100" y1="478" x2="1400" y2="478" stroke-width="6"/>
    </g>
    <!-- gegriffene Töne -->
    <g fill="#3ecf6e" stroke="#0c0f16" stroke-width="3">
      <circle cx="585" cy="296" r="17"/><circle cx="770" cy="296" r="17"/><circle cx="770" cy="252" r="17"/>
    </g>
  </g>
  <rect width="1280" height="720" fill="url(#spot)"/>
</svg>
